[package]
name = "pm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Partition Manager desktop application (eframe/egui)"
build = "build.rs"

[lib]
name = "pm_gui"
path = "src/lib.rs"

[[bin]]
name = "partition-manager"
path = "src/main.rs"

[dependencies]
pm-core = { path = "../pm-core" }
pm-platform = { path = "../pm-platform" }
pm-ops = { path = "../pm-ops" }
eframe.workspace = true
egui_extras.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
pm-parttable = { path = "../pm-parttable" }
uuid.workspace = true

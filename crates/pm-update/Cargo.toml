[package]
name = "pm-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Partition Manager self-update: release discovery, download, verification and install"

[dependencies]
pm-core = { path = "../pm-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
zip.workspace = true
flate2.workspace = true
tar.workspace = true
url = "2"
# Only for the `testing` feature (test doubles for the tests of dependent crates).
tempfile = { workspace = true, optional = true }

[features]
# Exposes `pm_update::testing`; enabled only from dev-dependencies.
testing = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true

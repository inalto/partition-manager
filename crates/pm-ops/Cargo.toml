[package]
name = "pm-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Partition Manager operations: in-memory model, pending operation list, planner/simulator and clone sizing"

[dependencies]
pm-core = { path = "../pm-core" }
pm-parttable = { path = "../pm-parttable" }
pm-platform = { path = "../pm-platform" }
pm-image = { path = "../pm-image" }
pm-fs = { path = "../pm-fs" }
serde = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# `testing` exposes `pm_image::rescue::FaultyDevice` (error-injecting disks for the executor tests).
pm-image = { path = "../pm-image", features = ["testing"] }
serde_json = { workspace = true }
tempfile = { workspace = true }

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
crc32fast = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
windows-sys = "0.59"
eframe = "0.29"
egui_extras = "0.29"
embed-resource = "2"
libc = "0.2"
plist = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
